name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Deny all permissions by default; grant only what each job needs.
permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # Pin the runner image and bound execution time.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Do not leave the GitHub token in the checkout remote.
          persist-credentials: false

      # Replace this step with the repository's real setup and verification commands.
      - name: Verify
        run: |
          set -euo pipefail
          echo "Configure repository checks"
